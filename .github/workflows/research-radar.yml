name: Research Radar

# Scheduled + manually-triggerable run of the ARISE Research Radar pipeline:
# OpenAlex roster discovery -> Notion upsert -> draft generation -> publication
# Slack notifications -> incremental citation discovery -> Notion upsert ->
# citation Slack notifications. Never publishes anything to social platforms
# -- every generated item lands in Notion for human review (see CLAUDE.md).
# The only outbound messages this workflow ever sends are the publication and
# citation Slack notifications, and only for genuinely new, non-historical
# rows (Slack Status=Pending -- see the notification steps below; historical
# rows are Suppressed and never post). Lint and tests must pass before any
# live pipeline step runs, so a broken change never reaches Notion,
# Anthropic, or Slack.

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is always UTC and does not shift for daylight
    # saving. 16:00 UTC = 8:00am America/Los_Angeles (PST, Nov-Mar) /
    # 9:00am America/Los_Angeles (PDT, Mar-Nov).
    - cron: "0 16 * * *"

# A new run (scheduled or manual) is queued behind an in-progress one rather
# than cancelling it, so two runs can never write to Notion at the same time
# and an in-progress write is never killed mid-way.
concurrency:
  group: research-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package (with dev dependencies)
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests
        run: pytest

      # 14-day lookback intentionally overlaps every previous run. Notion's
      # canonical-key upsert (src/arise_radar/sinks/notion.py) makes reruns
      # idempotent, so the overlap only adds resilience to a missed run --
      # it never creates duplicate rows.
      - name: Discover roster publications and sync to Notion
        run: |
          python scripts/run_roster.py \
            --roster config/roster.yaml \
            --days-back 30 \
            --write-notion

      # Generates internal summaries and draft social posts for eligible
      # rows and writes them to Notion (page body + preview property) as
      # drafts only -- never Approved, never published, always left for
      # human review.
      - name: Generate summaries and social drafts
        run: |
          python scripts/generate_drafts.py \
            --limit 10 \
            --write-notion

      # --error-report writes into logs/, which is gitignored/untracked and
      # does not exist in a fresh checkout. Shared by the publication and
      # citation Slack-notification steps below.
      - name: Create logs directory
        run: mkdir -p logs

      # Only rows the roster-sync/draft steps above just left Slack
      # Status=Pending are ever posted (see
      # arise_radar.notifications.publications.scan_publication_rows):
      # historical Suppressed rows (and rows with no Slack Status yet, i.e.
      # not backfilled) and already-Sent rows are never candidates, and
      # --retry-failed is deliberately omitted so a transient failure needs
      # a deliberate manual rerun, not a silent automatic repost. Runs only
      # if publication discovery/drafting above succeeded (GitHub Actions'
      # default step behavior) -- a catastrophic failure there must not
      # reach Slack at all; a completed run with per-row errors still exits
      # 0 and this step still runs, matching send_publication_notifications.py's
      # distinction between fatal and record-level failures. NOTION_TOKEN and
      # NOTION_DATA_SOURCE_ID already come from the job-level env above; only
      # the two Slack secrets are added at step level -- no ANTHROPIC_*, no
      # NOTION_CITATIONS_DATA_SOURCE_ID, no SLACK_SIGNALS_CHANNEL_ID.
      - name: Send publication Slack notifications
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_PAPERS_CHANNEL_ID: ${{ secrets.SLACK_PAPERS_CHANNEL_ID }}
        run: |
          python -u scripts/send_publication_notifications.py \
            --send \
            --error-report logs/publication_slack_errors.json

      # 30-day lookback intentionally overlaps every previous run; the
      # Citation Key upsert (src/arise_radar/sinks/notion_citations.py) makes
      # reruns idempotent, so the overlap only adds resilience to a missed
      # run -- it never creates duplicate rows. NEVER pass --baseline here:
      # that flag is only for the one-time historical import (already done --
      # 4,512 rows with Baseline=true/Slack Status=Suppressed) and marks
      # every discovered row Suppressed instead of Pending, which would
      # silently stop new citations from ever reaching Slack. Only
      # NOTION_CITATIONS_DATA_SOURCE_ID is added at step level -- NOTION_TOKEN
      # and NOTION_DATA_SOURCE_ID already come from the job-level env above;
      # this step never touches Slack and gets no Slack secret.
      - name: Discover recent citations and sync to Notion
        env:
          NOTION_CITATIONS_DATA_SOURCE_ID: ${{ secrets.NOTION_CITATIONS_DATA_SOURCE_ID }}
        run: |
          python -u scripts/run_citations.py \
            --since-days 30 \
            --write-notion \
            --error-report logs/citation_incremental_errors.json

      # Only rows the previous step just left Slack Status=Pending are ever
      # posted (see arise_radar.notifications.citations.scan_citation_rows):
      # historical Baseline=true/Suppressed rows and already-Sent rows are
      # never candidates, and --retry-failed is deliberately omitted so a
      # transient failure needs a deliberate manual rerun, not a silent
      # automatic repost. Runs only if the citation-discovery step above
      # succeeded (GitHub Actions' default step behavior) -- a catastrophic
      # discovery failure (bad config, Notion unreachable) must not reach
      # Slack at all; a completed discovery run with per-row errors still
      # exits 0 and this step still runs, matching run_citations.py's
      # existing distinction between fatal and record-level failures. Scoped
      # to exactly the four secrets this script reads -- no
      # NOTION_DATA_SOURCE_ID, no ANTHROPIC_*, no SLACK_PAPERS_CHANNEL_ID.
      - name: Send citation Slack notifications
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CITATIONS_DATA_SOURCE_ID: ${{ secrets.NOTION_CITATIONS_DATA_SOURCE_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNALS_CHANNEL_ID: ${{ secrets.SLACK_SIGNALS_CHANNEL_ID }}
        run: |
          python -u scripts/send_citation_notifications.py \
            --send \
            --error-report logs/citation_slack_errors.json

      # always(): all three error-report files should be inspectable even
      # when a step above failed (record-level errors) or was skipped (a
      # catastrophic upstream failure, in which case a file may legitimately
      # be missing -- if-no-files-found: warn surfaces that without failing
      # the run over a report that was never expected to exist).
      - name: Upload notification error reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-error-reports
          path: |
            logs/publication_slack_errors.json
            logs/citation_incremental_errors.json
            logs/citation_slack_errors.json
          if-no-files-found: warn
